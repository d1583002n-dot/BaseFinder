
name: BaseFinder Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build BaseFinder
        run: gradle build --no-daemon

      - name: List build outputs
        if: always()
        run: |
          echo "Checking build/libs..."
          find build -type f -name "*.jar" -print || true

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BaseFinder-1.1.0
          path: build/libs/*.jar
          if-no-files-found: error
          
